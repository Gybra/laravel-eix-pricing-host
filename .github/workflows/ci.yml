name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag eix-pricing-host:test .
      - run: |
          docker run --detach --name eix-host --publish 8000:80 \
            --env APP_ENV=testing \
            --env APP_DEBUG=false \
            --env APP_KEY="base64:$(openssl rand -base64 32)" \
            eix-pricing-host:test
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/up && exit 0
            sleep 1
          done
          docker logs eix-host
          exit 1

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer format:check
      - run: composer analyse
      - run: composer audit --locked --no-interaction
